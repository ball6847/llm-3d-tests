<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0c11">
<meta name="description" content="Full-viewport viewer for one model's raw Three.js render.">
<title>Viewer · 3D scene bench</title>
<link rel="stylesheet" href="app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cg fill='none' stroke='%237cd6c0' stroke-width='1.6'%3E%3Cellipse cx='12' cy='12' rx='9' ry='4'/%3E%3Cellipse cx='12' cy='12' rx='9' ry='4' transform='rotate(60 12 12)'/%3E%3Cellipse cx='12' cy='12' rx='9' ry='4' transform='rotate(120 12 12)'/%3E%3C/g%3E%3C/svg%3E">
</head>
<body data-page="viewer" class="viewer-body">

<header class="topbar viewer-topbar">
  <div class="topbar-inner viewer-bar">
    <a class="back-link" id="back-link" href="index.html">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M19 12H5"/><path d="m12 19-7-7 7-7"/>
      </svg>
      <span>All models</span>
    </a>
    <div class="viewer-id">
      <span class="version-chip" id="viewer-version" data-version="1">v1</span>
      <span class="viewer-model" id="viewer-model" translate="no"></span>
    </div>
    <div class="viewer-controls">
      <label class="visually-hidden" for="model-select">Switch model, same prompt version</label>
      <select class="select" id="model-select"></select>
      <a class="btn raw-link" id="raw-link" href="#" target="_blank" rel="noopener">
        <span>Raw file</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
        </svg>
      </a>
    </div>
  </div>
</header>

<main class="stage" id="stage">
  <div class="stage-status" id="stage-status" role="status">
    <span class="spinner" aria-hidden="true"></span>
    <span id="stage-status-text">Loading scene…</span>
  </div>

  <iframe id="scene-frame" title="Rendered scene" allow="fullscreen"></iframe>

  <div class="error-panel" id="error-panel" hidden tabindex="-1" aria-labelledby="error-title">
    <div class="error-card">
      <h1 id="error-title">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/>
        </svg>
        <span id="error-title-text">Model not found</span>
      </h1>
      <p id="error-detail"></p>
      <div class="error-actions" id="error-actions"></div>
      <a class="back-link error-back" id="error-back" href="index.html">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M19 12H5"/><path d="m12 19-7-7 7-7"/>
        </svg>
        <span>Back to all models</span>
      </a>
    </div>
  </div>
</main>

<script src="manifest.js"></script>
<script src="app.js"></script>
</body>
</html>
