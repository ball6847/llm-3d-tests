<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aurora Knot — Interactive Three.js Scene</title>
<style>
  /* Reset so the canvas fills the viewport with no scrollbars or gaps. */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #05060f; /* matches the WebGL clear color so there is no flash of white */
    font-family: "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif;
    color: #e8ecf8;
  }

  #scene {
    display: block;
    width: 100%;
    height: 100%;
  }

  /* ---------- HUD overlay (pure CSS, zero assets) ---------- */
  .hud {
    position: fixed;
    inset: 0;
    pointer-events: none; /* clicks/moves fall through to the canvas */
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 28px 34px;
    z-index: 5;
  }
  .hud-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
  }
  .brand {
    font-size: 11px;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: rgba(232, 236, 248, 0.55);
  }
  .brand strong {
    display: block;
    font-size: 13px;
    color: rgba(232, 236, 248, 0.9);
    letter-spacing: 0.45em;
    margin-bottom: 4px;
  }
  .hint {
    font-size: 10px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: rgba(232, 236, 248, 0.4);
    text-align: right;
    line-height: 1.9;
  }
  .hint em {
    font-style: normal;
    color: rgba(160, 220, 255, 0.85);
  }
  .title {
    text-align: left;
  }
  .title h1 {
    font-size: clamp(28px, 5vw, 54px);
    font-weight: 200;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    background: linear-gradient(120deg, #8be9fd 0%, #bd93f9 35%, #ff79c6 60%, #8be9fd 100%);
    background-size: 200% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: sheen 7s ease-in-out infinite;
  }
  .title p {
    margin-top: 10px;
    font-size: 11px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: rgba(232, 236, 248, 0.45);
  }
  @keyframes sheen {
    0%, 100% { background-position: 0% 50%; }
    50%      { background-position: 100% 50%; }
  }

  /* ---------- Loading overlay: fades out after frame #1 renders ---------- */
  #loader {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    background: #05060f;
    transition: opacity 0.9s ease;
  }
  #loader.hidden {
    opacity: 0;
    pointer-events: none; /* never block interaction once faded */
  }
  .spinner {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 2px solid rgba(140, 200, 255, 0.15);
    border-top-color: #8be9fd;
    border-right-color: #bd93f9;
    animation: spin 1.1s linear infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  #loader span {
    font-size: 11px;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: rgba(232, 236, 248, 0.65);
  }

  /* Respect users who prefer reduced motion: keep the scene but soften HUD animation. */
  @media (prefers-reduced-motion: reduce) {
    .title h1 { animation: none; }
    .spinner { animation-duration: 2.4s; }
  }
</style>
</head>
<body>

<!-- Loading overlay sits above the canvas; removed via opacity once the first frame renders. -->
<div id="loader" role="status" aria-live="polite">
  <div class="spinner"></div>
  <span>Loading…</span>
</div>

<!-- Non-interactive HUD: all pointer events pass through to the canvas. -->
<div class="hud">
  <div class="hud-top">
    <div class="brand"><strong>Aurora Knot</strong>Procedural · Realtime</div>
    <div class="hint"><em>Move your mouse</em><br />to orbit the scene</div>
  </div>
  <div class="title">
    <h1>Aurora</h1>
    <p>Iridescent torus knot · three.js</p>
  </div>
</div>

<canvas id="scene"></canvas>

<!--
  Import map: lets bare "three" specifiers and the official addons/ folder resolve to the
  same pinned CDN build, so the post-processing passes share one THREE instance.
  Pinned version keeps copy-paste runs reproducible.
-->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
// Post-processing chain: RenderPass -> UnrealBloomPass, combined by EffectComposer.
// UnrealBloomPass additively blurs bright (emissive) pixels on top of the base render,
// which is what makes the shader's hot rim/core visibly glow against the dark clear color.
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

/* ============================================================
   0. Small helpers / constants
   ============================================================ */
const canvas = document.getElementById('scene');
const loaderEl = document.getElementById('loader');
const BG_COLOR = 0x05060f; // keep in sync with the CSS background to avoid white flashes

/* ============================================================
   1. Renderer — capped pixel ratio so Retina screens do not
   render 3–4x the fragments (this is the single biggest GPU win).
   antialias:true because bloom alone does not smooth silhouette edges.
   ============================================================ */
const renderer = new THREE.WebGLRenderer({
  canvas,
  antialias: true,
  powerPreference: 'high-performance',
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(BG_COLOR, 1);

/* ============================================================
   2. Scene + camera. Fog adds depth cueing so distant particles
   melt into the background instead of popping against flat black.
   ============================================================ */
const scene = new THREE.Scene();
scene.background = new THREE.Color(BG_COLOR);
scene.fog = new THREE.FogExp2(BG_COLOR, 0.045);

const camera = new THREE.PerspectiveCamera(
  55,                                        // vertical fov
  window.innerWidth / window.innerHeight,    // aspect — recomputed on resize
  0.1,                                       // near plane
  100                                        // far plane (fog hides detail before this)
);
const CAMERA_RADIUS = 7.2;
camera.position.set(0, 1.2, CAMERA_RADIUS);

/* ============================================================
   3. Hero object — procedural TorusKnot with a custom ShaderMaterial.
   No textures/images are loaded; the iridescence is computed per-pixel
   from fresnel, world position and uTime (all GPU-side, zero uploads).
   ============================================================ */
const heroGeometry = new THREE.TorusKnotGeometry(1.15, 0.34, 256, 48, 2, 3);

const heroUniforms = {
  uTime: { value: 0 }, // seconds — drives pulse + palette drift
};

const heroMaterial = new THREE.ShaderMaterial({
  uniforms: heroUniforms,
  vertexShader: /* glsl */ `
    uniform float uTime;

    varying vec3 vNormal;    // view-space normal for lighting-ish fresnel
    varying vec3 vViewDir;   // view-space direction to camera
    varying vec3 vWorldPos;  // world position for palette bands
    varying float vPulse;    // 0..1 breathing factor shared with the fragment stage

    void main() {
      // Normal matrix keeps normals correct under non-uniform scale.
      vNormal = normalize(normalMatrix * normal);

      // Breathing displacement: push vertices along their normals with a
      // slow positional wave so the knot visibly "inhales".
      float wave = sin(uTime * 1.5 + position.y * 2.1 + position.x * 1.3)
                 * cos(uTime * 1.1 + position.z * 1.7);
      float pulse = wave * 0.5 + 0.5;
      vec3 displaced = position + normal * pulse * 0.085;

      vPulse = pulse;
      vWorldPos = (modelMatrix * vec4(displaced, 1.0)).xyz;

      vec4 mvPosition = modelViewMatrix * vec4(displaced, 1.0);
      vViewDir = normalize(-mvPosition.xyz); // camera sits at the view-space origin

      gl_Position = projectionMatrix * mvPosition;
    }
  `,
  fragmentShader: /* glsl */ `
    uniform float uTime;

    varying vec3 vNormal;
    varying vec3 vViewDir;
    varying vec3 vWorldPos;
    varying float vPulse;

    // IQ cosine palette: cheap, smooth, perfectly repeatable aurora hues.
    // Chosen over texture lookups to stay 100% procedural and GPU-cheap.
    vec3 auroraPalette(float t) {
      vec3 a = vec3(0.45, 0.42, 0.55);
      vec3 b = vec3(0.45, 0.48, 0.45);
      vec3 c = vec3(1.0, 1.0, 1.0);
      vec3 d = vec3(0.00, 0.33, 0.67); // phase offsets -> teal/violet/magenta drift
      return a + b * cos(6.28318 * (c * t + d));
    }

    void main() {
      vec3 N = normalize(vNormal);
      vec3 V = normalize(vViewDir);

      // Fresnel: surfaces facing the camera glow less, grazing angles glow more.
      float fresnel = pow(1.0 - abs(dot(N, V)), 2.0);

      // Slow vertical aurora band sweeping through the knot.
      float band = sin(vWorldPos.y * 2.6 + uTime * 0.8
                     + sin(vWorldPos.x * 1.8 + uTime * 0.6) * 1.4);
      band = band * 0.5 + 0.5;

      // Palette coordinate drifts with time and space -> rolling aurora shift.
      float t = uTime * 0.10 + vWorldPos.y * 0.14 + vWorldPos.x * 0.09 + vPulse * 0.30;
      vec3 aurora = auroraPalette(t);
      vec3 auroraHot = auroraPalette(t + 0.18); // phase-shifted second layer for depth

      vec3 deep = vec3(0.015, 0.02, 0.085); // near-black body so bloom reads as "emission"
      vec3 color = deep + aurora * (0.30 + 0.75 * band);

      // Hot rim: pushed above the bloom threshold so the silhouette glows,
      // but capped so pulse peaks cannot white out the whole surface.
      color += auroraHot * pow(fresnel, 2.4) * 1.35;

      // Pulse-driven core shimmer.
      color += aurora * vPulse * 0.22;

      gl_FragColor = vec4(color, 1.0);
    }
  `,
});

const hero = new THREE.Mesh(heroGeometry, heroMaterial);
scene.add(hero);

/* A slowly counter-rotating inner knot, additive and faint, gives the core
   parallax depth without adding geometry cost worth noticing. */
const innerGeometry = new THREE.TorusKnotGeometry(0.62, 0.10, 180, 32, 2, 3);
const innerMaterial = new THREE.MeshBasicMaterial({
  color: 0x9fdcff,
  transparent: true,
  opacity: 0.35,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
});
const innerKnot = new THREE.Mesh(innerGeometry, innerMaterial);
scene.add(innerKnot);

/* ============================================================
   4. Particle field — one BufferGeometry + gl.POINTS (a single draw call).
   Orbit math runs entirely in the vertex shader from static attributes,
   so zero per-frame CPU position updates and zero allocations.
   Size/opacity attenuate with view-space depth (depth-based fade).
   ============================================================ */
const PARTICLE_COUNT = 2600;
const positions = new Float32Array(PARTICLE_COUNT * 3); // required by three; real pos comes from the shader
const aRadius = new Float32Array(PARTICLE_COUNT);
const aSpeed  = new Float32Array(PARTICLE_COUNT);
const aPhase  = new Float32Array(PARTICLE_COUNT);
const aTilt   = new Float32Array(PARTICLE_COUNT);
const aSpin   = new Float32Array(PARTICLE_COUNT);
const aSize   = new Float32Array(PARTICLE_COUNT);
const aMix    = new Float32Array(PARTICLE_COUNT); // 0=cyan … 1=magenta

for (let i = 0; i < PARTICLE_COUNT; i++) {
  // Radical distribution biased toward the mid shell; avoids a hollow core and an over-dense rim.
  aRadius[i] = 2.1 + Math.pow(Math.random(), 0.8) * 4.3;
  aSpeed[i]  = (0.12 + Math.random() * 0.35) * (Math.random() < 0.5 ? 1 : 1); // keep all orbits same direction for coherence
  aPhase[i]  = Math.random() * Math.PI * 2;
  aTilt[i]   = (Math.random() - 0.5) * 1.15;   // vertical tilt in radians
  aSpin[i]   = Math.random() * Math.PI * 2;    // extra in-plane twist
  aSize[i]   = 0.8 + Math.pow(Math.random(), 1.7) * 2.6; // few big sparks, many motes
  aMix[i]    = Math.random();
}

const particleGeometry = new THREE.BufferGeometry();
particleGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
particleGeometry.setAttribute('aRadius', new THREE.BufferAttribute(aRadius, 1));
particleGeometry.setAttribute('aSpeed',  new THREE.BufferAttribute(aSpeed, 1));
particleGeometry.setAttribute('aPhase',  new THREE.BufferAttribute(aPhase, 1));
particleGeometry.setAttribute('aTilt',   new THREE.BufferAttribute(aTilt, 1));
particleGeometry.setAttribute('aSpin',   new THREE.BufferAttribute(aSpin, 1));
particleGeometry.setAttribute('aSize',   new THREE.BufferAttribute(aSize, 1));
particleGeometry.setAttribute('aMix',    new THREE.BufferAttribute(aMix, 1));
// Precomputed bounds keep the frustum-culling test stable (all orbits live inside this sphere).
particleGeometry.boundingSphere = new THREE.Sphere(new THREE.Vector3(0, 0, 0), 8);

const particleUniforms = {
  uTime: { value: 0 },
  uPixelRatio: { value: renderer.getPixelRatio() },
};

const particleMaterial = new THREE.ShaderMaterial({
  uniforms: particleUniforms,
  transparent: true,
  depthWrite: false,               // additive glows must not occlude each other
  blending: THREE.AdditiveBlending,
  vertexShader: /* glsl */ `
    uniform float uTime;
    uniform float uPixelRatio;

    attribute float aRadius;
    attribute float aSpeed;
    attribute float aPhase;
    attribute float aTilt;
    attribute float aSpin;
    attribute float aSize;
    attribute float aMix;

    varying float vAlpha;
    varying float vMix;

    void main() {
      float angle = uTime * aSpeed + aPhase;

      // Base orbit on the XZ plane, then tilt around X and twist around Y.
      vec3 p = vec3(cos(angle) * aRadius, 0.0, sin(angle) * aRadius);

      float cx = cos(aTilt), sx = sin(aTilt);
      p = vec3(p.x, p.y * cx - p.z * sx, p.y * sx + p.z * cx);

      float cy = cos(aSpin), sy = sin(aSpin);
      p = vec3(p.x * cy - p.z * sy, p.y, p.x * sy + p.z * cy);

      // Gentle vertical bob so orbits feel alive rather than mechanically flat.
      p.y += sin(uTime * 0.9 + aPhase * 3.0) * 0.22;

      vec4 mvPosition = modelViewMatrix * vec4(p, 1.0);
      float dist = max(-mvPosition.z, 0.001); // view-space depth, always positive in front of the camera

      // Depth-based fade: distant particles dim out, near ones stay bright.
      vAlpha = smoothstep(15.0, 4.0, dist);
      vMix = aMix;

      // Perspective point-size attenuation (scaled by pixel ratio so retina stays sharp).
      // 12.0 keeps near sparks ~15-20px and distant motes ~2px — anything larger
      // saturates the whole frame when 2600 additive points overlap.
      gl_PointSize = aSize * uPixelRatio * (12.0 / dist);
      gl_Position = projectionMatrix * mvPosition;
    }
  `,
  fragmentShader: /* glsl */ `
    varying float vAlpha;
    varying float vMix;

    void main() {
      // Soft radial falloff: one draw call per particle, no sprite texture needed.
      vec2 uv = gl_PointCoord - 0.5;
      float d = length(uv);
      float core = smoothstep(0.5, 0.05, d);
      float glow = pow(core, 2.6);

      vec3 cyan = vec3(0.55, 0.85, 1.0);
      vec3 magenta = vec3(0.85, 0.55, 1.0);
      vec3 color = mix(cyan, magenta, vMix);

      gl_FragColor = vec4(color * glow * 1.35, glow * vAlpha);
    }
  `,
});

const particles = new THREE.Points(particleGeometry, particleMaterial);
scene.add(particles);

/* ============================================================
   5. Bloom — threshold ~0.22 means only emissive rims/cores/particles
   bloom, not the whole frame. Kept in half-float-friendly defaults.
   ============================================================ */
const composer = new EffectComposer(renderer);
composer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
composer.setSize(window.innerWidth, window.innerHeight);

const renderPass = new RenderPass(scene, camera);
composer.addPass(renderPass);

const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  0.9,   // strength — glow intensity
  0.75,  // radius — how far the glow spreads
  0.22   // threshold — only pixels brighter than this bloom
);
composer.addPass(bloomPass);

/* ============================================================
   6. Mouse-reactive camera — target angles derive from normalized
   mouse (-1..1); actual angles are LERPed toward the target each
   frame, which is what produces the smooth, lagged "orbit" feel.
   Separate horizontal (azimuth) and vertical (polar) sensitivities.
   ============================================================ */
const pointer = { x: 0, y: 0 };          // normalized target, -1..1
const orbit = { azimuth: 0, polar: Math.PI / 2.6 }; // current (damped) values
const HORIZONTAL_SENSITIVITY = 0.85;     // radians of swing at full mouse deflection
const VERTICAL_SENSITIVITY = 0.42;
const DAMPING = 0.045;                   // lerp factor per frame — lower = floatier
const AUTO_ROTATE = 0.06;                // slow idle drift even without mouse input

function setPointerFromClient(clientX, clientY) {
  pointer.x = (clientX / window.innerWidth) * 2 - 1;
  pointer.y = (clientY / window.innerHeight) * 2 - 1;
}
window.addEventListener('mousemove', (e) => setPointerFromClient(e.clientX, e.clientY), { passive: true });
// Touch parity — one finger drag steers the camera on mobile.
window.addEventListener('touchmove', (e) => {
  if (e.touches.length > 0) setPointerFromClient(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: true });

/* ============================================================
   7. Resize — keep renderer, composer and camera aspect in sync so
   there is no stretching/tearing. Bloom pass resizes via composer.
   ============================================================ */
function onResize() {
  const width = window.innerWidth;
  const height = window.innerHeight;
  camera.aspect = width / height;
  camera.updateProjectionMatrix();
  renderer.setSize(width, height);
  composer.setSize(width, height); // also resizes internal bloom render targets
  particleUniforms.uPixelRatio.value = renderer.getPixelRatio();
}
window.addEventListener('resize', onResize);

/* ============================================================
   8. Animation loop — requestAnimationFrame self-throttles to the
   display refresh (~60fps), unlike setInterval. Delta is clamped so a
   background tab resubscribe does not teleport the simulation.
   uTime is accumulated from the clock so shader time never jumps.
   ============================================================ */
const clock = new THREE.Clock();
let elapsed = 0;
let firstFrameRendered = false;

function animate() {
  requestAnimationFrame(animate);

  const delta = Math.min(clock.getDelta(), 0.05); // clamp: avoids huge jumps after tab switches
  elapsed += delta;

  // --- Hero motion: slow tumble + counter-rotating inner knot ---
  hero.rotation.y = elapsed * 0.18;
  hero.rotation.x = Math.sin(elapsed * 0.25) * 0.22;
  hero.rotation.z = Math.cos(elapsed * 0.2) * 0.12;
  innerKnot.rotation.y = -elapsed * 0.4;
  innerKnot.rotation.x = elapsed * 0.22;
  const innerScale = 1 + Math.sin(elapsed * 1.6) * 0.08; // subtle breathing echo
  innerKnot.scale.setScalar(innerScale);

  // --- Shader time uniforms ---
  heroUniforms.uTime.value = elapsed;
  particleUniforms.uTime.value = elapsed;
  particles.rotation.y = elapsed * 0.02; // ultra-slow global precession

  // --- Camera orbit with mouse damping ---
  const targetAzimuth = elapsed * AUTO_ROTATE + pointer.x * HORIZONTAL_SENSITIVITY;
  const targetPolar = THREE.MathUtils.clamp(
    Math.PI / 2.6 + pointer.y * VERTICAL_SENSITIVITY,
    0.55,                    // never let the camera flip fully overhead/underfoot
    Math.PI - 0.85
  );
  orbit.azimuth += (targetAzimuth - orbit.azimuth) * DAMPING;
  orbit.polar += (targetPolar - orbit.polar) * DAMPING;

  camera.position.setFromSphericalCoords(CAMERA_RADIUS, orbit.polar, orbit.azimuth);
  camera.lookAt(0, 0, 0); // always frame the hero at the origin

  // --- Render through the bloom composer ---
  composer.render();

  // --- Fade the loading overlay only after the first real frame exists ---
  if (!firstFrameRendered) {
    firstFrameRendered = true;
    loaderEl.classList.add('hidden');
  }
}
animate();

/* ============================================================
   9. Cleanup — release GPU resources on page teardown so we do not
   leak geometries/materials/render targets (matters for HMR & bfcache).
   ============================================================ */
window.addEventListener('beforeunload', () => {
  heroGeometry.dispose();
  innerGeometry.dispose();
  particleGeometry.dispose();
  heroMaterial.dispose();
  innerMaterial.dispose();
  particleMaterial.dispose();
  bloomPass.dispose();
  composer.dispose();
  renderer.dispose();
});
</script>
</body>
</html>
