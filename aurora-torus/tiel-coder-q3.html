<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aurora Torus Knot — Three.js</title>
<style>
  /* Full-bleed canvas: the scene owns the whole viewport, no margins. */
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #05060a; }
  #scene { display: block; width: 100vw; height: 100vh; }

  /* Loading overlay: covers the page until the first frame proves init succeeded.
     The fade-out is a CSS opacity transition, toggled by JS after frame one. */
  #loader {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: #05060a; color: #9fe7ff;
    font: 200 18px/1 system-ui, sans-serif; letter-spacing: .3em;
    z-index: 10;
    transition: opacity .8s ease;
  }
  #loader.hidden { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
  <div id="scene"></div>
  <div id="loader">Loading…</div>

  <!--
    THREE.JS CORE VIA CDN (no build tools).
    We load only the UMD core from cdnjs here. The post-processing stack
    (EffectComposer / RenderPass / UnrealBloomPass) is vendored inline below
    because no CDN in this sandbox reliably serves three's examples/js files,
    and a self-contained file should not silently fail to bloom.
  -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
/* =========================================================================
   Aurora Torus Knot — self-contained Three.js scene.
   Each technique is annotated with WHY it exists.
   ========================================================================= */

(() => {
  'use strict';

  // ---- Renderer -----------------------------------------------------------------
  // setPixelRatio(min(dpr, 2)) caps Retina 3x/4x screens from issuing a huge
  // fragment count for no visible gain — the cheapest big perf win available.
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(0x05060a); // dark background so the bloom glow reads clearly
  document.getElementById('scene').appendChild(renderer.domElement);

  // ---- Scene + Camera -----------------------------------------------------------
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(
    55, window.innerWidth / window.innerHeight, 0.1, 100
  );
  camera.position.set(0, 0, 6);

  // ---- Hero object: procedural torus knot ---------------------------------------
  // TorusKnotGeometry is generated purely in code (no external mesh asset).
  const heroGeo = new THREE.TorusKnotGeometry(1.0, 0.32, 160, 24);

  // Custom shader material. The vertex shader displaces points along their
  // normal by a sine wave driven by uTime -> the surface "breathes". The
  // fragment shader mixes hues by view angle + time -> aurora iridescence.
  const heroMat = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0.0 } },
    vertexShader: /* glsl */ `
      uniform float uTime;
      varying vec3 vNormal;
      varying vec3 vViewDir;
      varying float vDisplacement;
      void main() {
        // Wave-based normal displacement gives the object a living, pulsating shape.
        float disp = sin(position.x * 3.0 + uTime * 1.5)
                   * cos(position.y * 3.0 + uTime * 1.2)
                   * sin(position.z * 3.0 + uTime * 0.8);
        vDisplacement = disp;
        vec3 newPos = position + normal * disp * 0.12;
        vNormal   = normalize(normalMatrix * normal);
        // Direction from vertex to camera (view space) for the fresnel iridescence.
        vViewDir  = normalize(cameraPosition - (modelViewMatrix * vec4(newPos, 1.0)).xyz);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(newPos, 1.0);
      }
    `,
    fragmentShader: /* glsl */ `
      uniform float uTime;
      varying vec3 vNormal;
      varying vec3 vViewDir;
      varying float vDisplacement;
      // Palette of aurora hues (teal -> violet -> magenta), shifted by time.
      vec3 palette(float t) {
        return vec3(0.4, 0.9, 1.0) * smoothstep(0.0, 0.5, sin(t) * 0.5 + 0.5)
             + vec3(0.9, 0.3, 0.8)  * smoothstep(0.4, 1.0, sin(t * 1.3 + 2.0) * 0.5 + 0.5);
      }
      void main() {
        // Fresnel: edges catch more color than faces -> rim glow that shifts over time.
        float fresnel = pow(1.0 - dot(normalize(vNormal), normalize(vViewDir)), 2.0);
        float hue = uTime * 0.4 + vDisplacement * 2.0 + fresnel * 1.5;
        vec3 color = palette(hue);
        // Emissive boost so the bloom pass has bright pixels to glow from.
        gl_FragColor = vec4(color * (1.2 + fresnel * 2.0), 1.0);
      }
    `
  });

  const hero = new THREE.Mesh(heroGeo, heroMat);
  scene.add(hero);

  // ---- Particle field -----------------------------------------------------------
  // Thousands of points orbit the hero. BufferGeometry + gl.POINTS is used
  // instead of one mesh per particle because a single draw call renders all of
  // them — thousands of individual meshes would crater the frame rate.
  const PARTICLE_COUNT = 4000;
  const positions = new Float32Array(PARTICLE_COUNT * 3);
  const speeds    = new Float32Array(PARTICLE_COUNT);   // per-orbit angular speed
  const radii     = new Float32Array(PARTICLE_COUNT);   // orbit radius
  const offsets   = new Float32Array(PARTICLE_COUNT);   // start angle

  for (let i = 0; i < PARTICLE_COUNT; i++) {
    radii[i]   = 1.8 + Math.random() * 4.5;
    offsets[i] = Math.random() * Math.PI * 2;
    speeds[i]  = 0.15 + Math.random() * 0.6;
    // Seed on a sphere shell around the hero.
    const theta = Math.random() * Math.PI * 2;
    const phi   = Math.acos(2 * Math.random() - 1);
    const r     = radii[i];
    positions[i * 3]     = r * Math.sin(phi) * Math.cos(theta);
    positions[i * 3 + 1] = (Math.random() - 0.5) * 4.0;
    positions[i * 3 + 2] = r * Math.cos(phi) * Math.sin(theta);
  }

  const particleGeo = new THREE.BufferGeometry();
  particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

  // PointsMaterial with sizeAttenuation gives per-point screen size. Opacity is
  // driven in the shader by distance to camera for depth-based fade.
  const particleMat = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0.0 } },
    vertexShader: /* glsl */ `
      varying float vDist;
      void main() {
        vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
        vDist = -mvPos.z; // view-space depth (negative along the view axis)
        gl_Position = projectionMatrix * mvPos;
      }
    `,
    fragmentShader: /* glsl */ `
      varying float vDist;
      uniform float uTime;
      void main() {
        // Depth-based fade: farther particles dim out toward the horizon distance.
        float fade = smoothstep(14.0, 1.5, vDist);
        // Simple twinkle via time so the field feels alive without per-particle CPU cost.
        float tw = 0.6 + 0.4 * sin(vDist * 3.0 + uTime * 2.0);
        gl_FragColor = vec4(0.7, 1.0, 1.15, fade * tw);
      }
    `,
    transparent: true,
    depthWrite: false // don't occlude other particles; keeps the glow additive
  });

  const points = new THREE.Points(particleGeo, particleMat);
  scene.add(points);

  // ===========================================================================
  // POST-PROCESSING (vendored inline — see header comment for why).
  // A compact EffectComposer + RenderPass + UnrealBloomPass built on Three.js
  // render targets and additive blending. Standard bloom recipe:
  //   1. Render scene -> sceneRT (RenderPass)
  //   2. Bright-pass (threshold) -> bloomRT
  //   3. Iterative two-pass gaussian blur of bloomRT (h, then v)
  //   4. Composite sceneRT + blurred bloom additively -> screen
  // ===========================================================================

  // RenderPass: renders the scene into its own offscreen render target so the
  // downstream pass can sample it independently of the canvas.
  class RenderPass {
    constructor(scene, camera) {
      this.scene = scene;
      this.camera = camera;
      this.renderTarget = null;
    }
    setSize(w, h) {
      // Half-float target: cheaper and HDR-friendly for the bloom to pull from.
      this.renderTarget = new THREE.WebGLRenderTarget(w, h, { type: THREE.HalfFloatType });
    }
    render() {
      renderer.render(this.scene, this.camera, this.renderTarget);
    }
  }

  // UnrealBloomPass: bright-pass + iterative two-pass gaussian blur + additive
  // composite. strength = glow intensity, radius = blur spread (in units),
  // threshold = pixel brightness above which pixels contribute to the bloom.
  class UnrealBloomPass {
    constructor(resolution, strength, radius, threshold) {
      this.strength = strength;
      this.radius = radius;
      this.threshold = threshold;
      this.quad = new THREE.PlaneGeometry(2, 2); // spans [-1,1], fills the screen
      this.camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    }
    // Rebuild the fixed-size ping-pong buffers when the viewport changes so the
    // blur never samples a stale (mismatched) resolution.
    setSize(w, h) {
      this.ping = new THREE.WebGLRenderTarget(w >> 1, h >> 1, { type: THREE.HalfFloatType });
      this.pong = new THREE.WebGLRenderTarget(w >> 1, h >> 1, { type: THREE.HalfFloatType });
    }

    // Render a fullscreen quad textured with `map` into `outRT` (null = screen).
    _blit(material, map, outRT) {
      material.depthTest = false;
      material.depthWrite = false;
      if (map !== null) material.map = map;
      const prevTarget = renderer.getRenderTarget();
      renderer.setRenderTarget(outRT);
      const quad = new THREE.Mesh(this.quad, material);
      renderer.render(quad, this.camera);
      quad.geometry.dispose?.();
      renderer.setRenderTarget(prevTarget);
    }

    render(sceneRT) {
      const w = sceneRT.width, h = sceneRT.height;

      // 1) Bright-pass: keep only pixels above the threshold.
      const brightMat = new THREE.ShaderMaterial({
        uniforms: {
          tDiffTexture: { value: sceneRT.texture },
          threshold: { value: this.threshold }
        },
        vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);}`,
        fragmentShader: `
          uniform sampler2D tDiffTexture; uniform float threshold;
          varying vec2 vUv;
          void main(){
            vec4 c = texture2D(tDiffTexture, vUv);
            float b = dot(c.rgb, vec3(0.2126,0.7152,0.0722));
            gl_FragColor = vec4(c.rgb * smoothstep(threshold, threshold + 0.5, b), 1.0);
          }`
      });
      const brightRT = new THREE.WebGLRenderTarget(w, h, { type: THREE.HalfFloatType });
      this._blit(brightMat, sceneRT.texture, brightRT);

      // 2) Iterative two-pass gaussian blur (half-res), ping-pong a few times.
      const ping = new THREE.WebGLRenderTarget(w >> 1, h >> 1, { type: THREE.HalfFloatType });
      const pong = new THREE.WebGLRenderTarget(w >> 1, h >> 1, { type: THREE.HalfFloatType });
      const blurMat = new THREE.ShaderMaterial({
        uniforms: {
          tDiff: { value: null },
          direction: { value: new THREE.Vector2(1, 0) },
          radius: { value: this.radius }
        },
        vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);}`,
        fragmentShader: `
          uniform sampler2D tDiff; uniform vec2 direction; uniform float radius;
          varying vec2 vUv;
          void main(){
            const int S = 10; vec3 sum = vec3(0.0); float total = 0.0;
            for (int i = 0; i < S; i++) {
              float f = float(i) / float(S - 1) - 0.5;
              float w_ = 1.0 - abs(f);
              sum += texture2D(tDiff, vUv + direction * f * radius).rgb * w_;
              total += w_;
            }
            gl_FragColor = vec4(sum / total, 1.0);
          }`
      });
      let read = brightRT.texture;
      for (let i = 0; i < 3; i++) { // ping-pong h then v, a few times for a fatter blur
        blurMat.uniforms.direction.value.set(1, 0);
        this._blit(blurMat, read, ping); read = ping.texture;
        blurMat.uniforms.direction.value.set(0, 1);
        this._blit(blurMat, read, pong); read = pong.texture;
      }

      // 3) Composite: add the blurred bloom onto the original scene -> screen.
      const compositeMat = new THREE.ShaderMaterial({
        uniforms: {
          tDiffScene: { value: sceneRT.texture },
          tDiffBloom: { value: read },
          strength: { value: this.strength }
        },
        vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);}`,
        fragmentShader: `
          uniform sampler2D tDiffScene; uniform sampler2D tDiffBloom; uniform float strength;
          varying vec2 vUv;
          void main(){
            vec3 s = texture2D(tDiffScene, vUv).rgb;
            vec3 b = texture2D(tDiffBloom, vUv).rgb * strength;
            gl_FragColor = vec4(s + b, 1.0);
          }`
      });
      this._blit(compositeMat, null, null); // render to the screen (backbuffer)

      // Dispose per-frame temp targets/materials so bloom doesn't leak VRAM.
      brightRT.dispose(); ping.dispose(); pong.dispose();
      brightMat.dispose(); blurMat.dispose(); compositeMat.dispose();
    }
  }

  // EffectComposer: owns the pass chain and drives render() in order.
  class EffectComposer {
    constructor(r) { this.renderer = r; this.passes = []; }
    addPass(pass) { this.passes.push(pass); return this; }
    setSize(w, h) {
      this.renderer.setSize(w, h);
      for (const p of this.passes) if (p.setSize) p.setSize(w, h);
    }
    render() {
      // 1) RenderPass draws the scene into its own render target.
      this.passes[0].render();
      // 2) UnrealBloomPass consumes that target and outputs to the screen.
      if (this.passes[1]) this.passes[1].render(this.passes[0].renderTarget);
    }
    dispose() { for (const p of this.passes) if (p.dispose) p.dispose(); }
  }

  const composer = new EffectComposer(renderer);
  const renderPass = new RenderPass(scene, camera);
  composer.addPass(renderPass);
  const bloom = new UnrealBloomPass(
    [window.innerWidth, window.innerHeight], 1.4, 0.6, 0.85
  );
  composer.addPass(bloom);
  // Size the render targets once up front (RenderPass.renderTarget is null otherwise).
  composer.setSize(window.innerWidth, window.innerHeight);

  // ---- Mouse-reactive object rotation (smooth damping, not snapping) ------------
  // We store a target rotation and Lerp the live rotation toward it each frame.
  // Lerp with a factor < 1 = exponential easing -> smooth, non-snap follow.
  const mouse = { x: 0, y: 0, tx: 0, ty: 0 };
  const DAMPING = 0.18;      // larger = snappier follow (0.05 lagged behind fast moves)
  const H_SENSITIVITY = 1.5; // max radians of yaw as the mouse spans the screen
  const V_SENSITIVITY = 1.0; // max radians of pitch as the mouse spans the screen

  window.addEventListener('pointermove', (e) => {
    mouse.tx = (e.clientX / window.innerWidth) * 2 - 1; // normalize to [-1,1]
    mouse.ty = -(e.clientY / window.innerHeight) * 2 + 1;
  });

  // ---- Responsive resize --------------------------------------------------------
  // On resize we update aspect ratio AND the composer/target size so bloom isn't
  // sampled at a stale resolution (which would tear or distort).
  function onResize() {
    const w = window.innerWidth, h = window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    composer.setSize(w, h);
  }
  window.addEventListener('resize', onResize);

  // ---- Animation loop with ~60fps cap ------------------------------------------
  // requestAnimationFrame drives the loop; a frame-time throttle caps it near
  // 60fps so idle/background tabs don't spin the GPU at 120+ fps for no benefit.
  const FRAME_BUDGET = 1000 / 60; // ms per frame for 60fps
  let lastFrame = performance.now();

  function animate(now) {
    requestAnimationFrame(animate);

    // Throttle to ~60fps: skip heavy work if the budget hasn't elapsed.
    const delta = now - lastFrame;
    if (delta < FRAME_BUDGET) return;
    lastFrame = now - (delta % FRAME_BUDGET);

    const t = now * 0.001; // seconds, for shader uTime

    heroMat.uniforms.uTime.value = t;
    particleMat.uniforms.uTime.value = t;

    // Slowly rotate the hero so the aurora shift has motion to play over.
    hero.rotation.y = t * 0.3;
    hero.rotation.x = Math.sin(t * 0.2) * 0.15;

    // Animate particle orbits on CPU (simple planar orbit per point). Cheap and
    // keeps the per-particle math readable rather than packed into the shader.
    const pos = particleGeo.attributes.position.array;
    for (let i = 0; i < PARTICLE_COUNT; i++) {
      const r = radii[i];
      const a = offsets[i] + t * speeds[i];
      pos[i * 3]     = Math.cos(a) * r;
      pos[i * 3 + 2] = Math.sin(a) * r;
      pos[i * 3 + 1] += Math.sin(a * 2.0 + t) * 0.004; // gentle vertical bob
    }
    particleGeo.attributes.position.needsUpdate = true;

    // Smoothly rotate the HERO toward the mouse position. Lerp (factor < 1) gives
    // exponential easing -> smooth follow, not a snap. Mouse X yaws the object,
    // mouse Y tilts it; the object also keeps its gentle time-based spin.
    mouse.x += (mouse.tx * H_SENSITIVITY - mouse.x) * DAMPING;
    mouse.y += (mouse.ty * V_SENSITIVITY - mouse.y) * DAMPING;
    hero.rotation.y = t * 0.3 + mouse.x;   // self-spin + mouse-driven yaw
    hero.rotation.x = Math.sin(t * 0.2) * 0.15 + mouse.y; // tilt toward the cursor
    camera.rotation.set(0, 0, 0);          // fixed camera: the object rotates in place

    composer.render();

    // First frame rendered: signal the loading overlay to fade out.
    if (!window.__sceneReady) {
      window.__sceneReady = true;
      const loader = document.getElementById('loader');
      if (loader) loader.classList.add('hidden');
    }
  }
  requestAnimationFrame(animate);

  // ---- Cleanup / no memory leaks ------------------------------------------------
  // If rebuilt (e.g. hot reload), dispose GPU resources so old geometries,
  // materials and render targets don't leak VRAM. Exposed for callers.
  window.__dispose = () => {
    heroGeo.dispose(); heroMat.dispose();
    particleGeo.dispose(); particleMat.dispose();
    renderer.dispose(); composer.dispose();
  };
})();
</script>
</body>
</html>
