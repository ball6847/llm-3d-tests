<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Aurora Torus — Three.js</title>
<style>
  /* Dark void so HDR bloom reads as glow instead of washing out. */
  html,body{margin:0;height:100%;overflow:hidden;background:#030308;color:#dfe8ff;
    font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  #app{position:fixed;inset:0}
  canvas{display:block}
  /* Loading overlay: fades out in JS after the first frame so a slow CDN
     never leaves a black screen with no feedback. */
  #loader{position:fixed;inset:0;display:grid;place-items:center;background:#030308;
    z-index:10;transition:opacity .7s ease}
  #loader.hidden{opacity:0;pointer-events:none}
  #loader span{letter-spacing:.35em;text-transform:uppercase;font-size:12px;opacity:.75}
  .hud{position:fixed;left:20px;bottom:18px;z-index:5;pointer-events:none}
  .hud h1{margin:0 0 4px;font-size:15px;font-weight:600;letter-spacing:.18em;text-transform:uppercase}
  .hud p{margin:0;font-size:12px;opacity:.55}
</style>
</head>
<body>
<div id="app"></div>
<div id="loader"><span>Loading…</span></div>
<div class="hud"><h1>Aurora Torus</h1><p>Move mouse to orbit · procedural Three.js, no assets</p></div>

<!-- Import map: bare "three" specifier -> CDN build, "three/addons/" -> examples.
     Lets us use ES modules + EffectComposer without a bundler. -->
<script type="importmap">
{"imports":{
  "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ---------- Renderer ----------
   setPixelRatio(min(dpr,2)): full sharpness on Retina without 4x fragment
   cost on 3x phones. toneMapping ACES gives filmic highlights for bloom. */
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x030308);
const camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 0.1, 100);

/* ---------- Hero: torus knot, custom GLSL ----------
   Vertex shader pulses geometry along its normal (uTime) so the silhouette
   breathes. Fragment shader mixes a cosine-palette aurora with a fresnel rim;
   brightness is pushed >1 so UnrealBloom threshold catches it. */
const heroUniforms = { uTime:{ value:0 } };
const hero = new THREE.Mesh(
  new THREE.TorusKnotGeometry(1.45, 0.42, 240, 40),
  new THREE.ShaderMaterial({
    uniforms: heroUniforms,
    vertexShader: /* glsl */`
      uniform float uTime;
      varying vec3 vNormal; varying vec3 vPos; varying float vPulse; varying vec3 vView;
      void main(){
        vPulse = sin(uTime*1.4 + position.y*2.0 + position.x*1.5)*0.5+0.5;
        vec3 p = position + normal * (0.05 + 0.09*vPulse); // breathing displacement
        vNormal = normalize(normalMatrix * normal); // view space, matches vView
        vPos = p;
        vec4 mv = modelViewMatrix * vec4(p,1.0);
        vView = mv.xyz; // view-space pos: viewDir = normalize(-vView) is correct fresnel input
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: /* glsl */`
      uniform float uTime;
      varying vec3 vNormal; varying vec3 vPos; varying float vPulse; varying vec3 vView;
      // Cosine palette (IQ): smooth rainbow cycle with one uTime-driven phase.
      vec3 palette(float t){ return 0.55 + 0.45*cos(6.2831*(t*vec3(1.0,1.0,1.0)+vec3(0.0,0.33,0.67))); }
      void main(){
        vec3 viewDir = normalize(-vView);
        float fres = pow(1.0 - max(dot(normalize(vNormal), viewDir), 0.0), 2.2); // rim only, ~0 at centre
        float bands = sin(vPos.y*6.0 + uTime*1.8 + vPulse*3.0)*0.5+0.5; // aurora bands
        vec3 aurora = palette(0.12*uTime + bands*0.45 + length(vPos)*0.18);
        vec3 col = aurora*(0.42+0.32*vPulse) + fres*palette(0.5+0.2*uTime)*0.85;
        gl_FragColor = vec4(col*1.15, 1.0); // HDR: >1 feeds bloom, kept <~1.4 to avoid white-out
      }`
  })
);
scene.add(hero);

/* Faint wire shell for depth cueing; additive so it never blocks the hero. */
const shell = new THREE.Mesh(
  new THREE.IcosahedronGeometry(2.6, 1),
  new THREE.MeshBasicMaterial({ color:0x334466, wireframe:true, transparent:true, opacity:0.18 })
);
scene.add(shell);

/* ---------- Particle field: ONE BufferGeometry, gl.POINTS ----------
   Thousands of points in a single draw call beat thousands of meshes.
   Orbit happens on the GPU (rotate in vertex shader by uTime*speed) so the
   CPU never touches positions per frame. Size + opacity fade with view
   distance in the vertex shader = depth-based fade. */
const COUNT = 4500;
const pos = new Float32Array(COUNT*3), scale = new Float32Array(COUNT),
      speed = new Float32Array(COUNT), phase = new Float32Array(COUNT);
for (let i=0;i<COUNT;i++){
  const r = 3.4 + Math.random()*5.5;               // shell 3.4..8.9 around hero (kept off camera path)
  const th = Math.random()*Math.PI*2, ph = Math.acos(2*Math.random()-1);
  pos[i*3]   = r*Math.sin(ph)*Math.cos(th);
  pos[i*3+1] = r*Math.sin(ph)*Math.sin(th)*0.7;    // flattened disc look
  pos[i*3+2] = r*Math.cos(ph);
  scale[i] = 0.4 + Math.random()*1.1;
  speed[i] = (0.05 + Math.random()*0.25) * (Math.random()<0.5?-1:1);
  phase[i] = Math.random()*Math.PI*2;
}
const pGeo = new THREE.BufferGeometry();
pGeo.setAttribute('position', new THREE.BufferAttribute(pos,3));
pGeo.setAttribute('aScale',   new THREE.BufferAttribute(scale,1));
pGeo.setAttribute('aSpeed',   new THREE.BufferAttribute(speed,1));
pGeo.setAttribute('aPhase',   new THREE.BufferAttribute(phase,1));
const pUniforms = { uTime:{ value:0 }, uPixelRatio:{ value: renderer.getPixelRatio() } };
const points = new THREE.Points(pGeo, new THREE.ShaderMaterial({
  uniforms: pUniforms, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
  vertexShader: /* glsl */`
    uniform float uTime; uniform float uPixelRatio;
    attribute float aScale; attribute float aSpeed; attribute float aPhase;
    varying float vFade; varying float vTwinkle;
    void main(){
      float a = uTime*aSpeed + aPhase; float c=cos(a), s=sin(a);
      vec3 p = vec3(position.x*c - position.z*s, position.y, position.x*s + position.z*c);
      vec4 mv = modelViewMatrix * vec4(p,1.0);
      float dist = -mv.z;
      vFade = 1.0/(1.0 + dist*0.28);               // depth fade: near=bright, far=faint
      vTwinkle = 0.6 + 0.4*sin(uTime*2.0 + aPhase*7.0);
      gl_PointSize = aScale * uPixelRatio * (26.0/dist); // ~4px at hero distance, capped growth near camera
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: /* glsl */`
    varying float vFade; varying float vTwinkle;
    void main(){
      float d = length(gl_PointCoord - 0.5);
      float alpha = smoothstep(0.5, 0.0, d) * vFade * vTwinkle * 0.55; // soft round sprite
      vec3 col = mix(vec3(0.35,0.6,1.0), vec3(0.9,0.4,1.0), vFade);
      gl_FragColor = vec4(col*0.9, alpha);
    }`
}));
scene.add(points);

/* ---------- Bloom ----------
   EffectComposer chain: Render -> UnrealBloom -> OutputPass (tone map/sRGB).
   Threshold 0.55 + strength 0.65: only HDR hero/pixels bloom, dark bg stays dark. */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.65, 0.5, 0.55);
composer.addPass(bloom);
composer.addPass(new OutputPass());

/* ---------- Mouse orbit: damped, never snapping ----------
   Target angles from normalized mouse (-1..1); current angles ease toward
   them with THREE.MathUtils.damp (frame-rate independent lerp). */
let targetTheta = 0, targetPhi = Math.PI/2, theta = 0, phi = Math.PI/2;
const RADIUS = 7;
window.addEventListener('pointermove', (e)=>{
  const nx = (e.clientX/window.innerWidth)*2 - 1;    // horizontal sensitivity
  const ny = (e.clientY/window.innerHeight)*2 - 1;   // vertical sensitivity
  targetTheta = nx * Math.PI * 0.85;
  targetPhi   = THREE.MathUtils.clamp(Math.PI/2 + ny * Math.PI * 0.55, 0.35, Math.PI-0.35);
}, { passive:true });

/* ---------- Resize ----------
   Update camera aspect + renderer + composer together, or the image tears
   and bloom resolution stretches. */
window.addEventListener('resize', ()=>{
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w/h; camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  composer.setSize(w, h); // also resizes bloom pass internally
});

/* ---------- Loop: capped at ~60fps ----------
   requestAnimationFrame + skip frames <16.7ms apart. CPU work (uniforms,
   camera) is O(1); orbiting is GPU-side, so no per-frame allocation. */
const clock = new THREE.Clock();
let last = 0, loaderHidden = false;
function disposeScene(){ // call on teardown/rebuild to avoid GPU leaks
  scene.traverse(o=>{ o.geometry?.dispose(); o.material?.dispose?.(); });
  composer.dispose?.();
}
function animate(t){
  requestAnimationFrame(animate);
  if (t - last < 1000/60) return; // ~60fps cap
  last = t;
  const dt = Math.min(clock.getDelta(), 0.05); // clamp tab-switch spikes
  const time = clock.elapsedTime;
  heroUniforms.uTime.value = time;
  pUniforms.uTime.value = time;
  hero.rotation.y += dt*0.25; hero.rotation.x += dt*0.12;
  shell.rotation.y -= dt*0.06;
  points.rotation.y += dt*0.02;
  // Damped orbit (lambda ~4 = smooth but responsive).
  theta = THREE.MathUtils.damp(theta, targetTheta, 4, dt);
  phi   = THREE.MathUtils.damp(phi,   targetPhi,   4, dt);
  camera.position.set(
    RADIUS*Math.sin(phi)*Math.cos(theta),
    RADIUS*Math.cos(phi),
    RADIUS*Math.sin(phi)*Math.sin(theta)
  );
  camera.lookAt(0,0,0);
  composer.render(); // through bloom, not renderer.render()
  if (!loaderHidden){ // fade loader only after a real frame exists
    loaderHidden = true;
    document.getElementById('loader').classList.add('hidden');
  }
}
requestAnimationFrame(animate);

// Graceful fallback: if the CDN/module fails, say so instead of hanging.
setTimeout(()=>{ if(!loaderHidden) document.querySelector('#loader span').textContent = 'Still loading — check connection…'; }, 6000);
window.addEventListener('error', ()=>{
  if(!loaderHidden) document.querySelector('#loader span').textContent = 'Failed to load — check connection and reload.';
}, { once:true });
</script>
</body>
</html>
