<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aurora Knot</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05060a; }
  #scene { position: fixed; inset: 0; display: block; cursor: grab; touch-action: none; }
  #scene.dragging { cursor: grabbing; }
  /* Loading overlay sits above the canvas and fades once the first frame renders */
  #loading {
    position: fixed; inset: 0; z-index: 10;
    display: flex; align-items: center; justify-content: center;
    background: #05060a; color: #9aa3b2;
    font: 14px/1 system-ui, sans-serif; letter-spacing: 0.12em;
    transition: opacity 0.6s ease;
  }
  #loading.hidden { opacity: 0; pointer-events: none; }
  #hint {
    position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
    color: rgba(255, 255, 255, 0.35); font: 12px system-ui, sans-serif;
    pointer-events: none; user-select: none;
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="loading">Loading&hellip;</div>
<div id="hint">drag to orbit &middot; scroll to zoom</div>

<!-- importmap lets the module script use bare specifiers while staying a single file -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const canvas = document.getElementById('scene');
const loadingEl = document.getElementById('loading');

// --- Renderer ---------------------------------------------------------------
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
} catch (err) {
  // Graceful fallback: tell the user instead of a blank page
  loadingEl.textContent = 'WebGL is not available in this browser.';
  throw err;
}
// Cap pixel ratio: a dpr-3 phone would rasterize 2.25x more pixels than needed
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping; // filmic rolloff so bloom highlights do not clip harshly

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05060a); // near-black so bloom reads as glow

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 100);

// --- Hero object -------------------------------------------------------------
// Torus knot: dense segments so the vertex displacement has enough vertices to be smooth
const heroGeometry = new THREE.TorusKnotGeometry(1, 0.32, 220, 36);

const heroMaterial = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 } },
  vertexShader: /* glsl */`
    uniform float uTime;
    varying vec3 vNormal;
    varying vec3 vPos;
    varying float vPulse;

    void main() {
      // Layered sines along the surface make a breathing bulge.
      // Cheaper than a noise texture and reads organic on a torus knot.
      float pulse = sin(position.x * 2.1 + uTime * 1.3)
                  + sin(position.y * 2.7 + uTime * 0.9)
                  + sin(position.z * 1.9 + uTime * 1.7);
      vPulse = pulse;
      vec3 displaced = position + normal * (0.06 * pulse);
      vNormal = normalize(normalMatrix * normal);
      vec4 mvPosition = modelViewMatrix * vec4(displaced, 1.0);
      vPos = mvPosition.xyz;
      gl_Position = projectionMatrix * mvPosition;
    }
  `,
  fragmentShader: /* glsl */`
    uniform float uTime;
    varying vec3 vNormal;
    varying vec3 vPos;
    varying float vPulse;

    // IQ cosine palette: a + b * cos(2*pi*(c*t + d)).
    // Smooth continuous hue shift without a texture lookup.
    vec3 palette(float t) {
      return vec3(0.5) + vec3(0.5) * cos(6.28318 * (t + vec3(0.0, 0.33, 0.67)));
    }

    void main() {
      // Cheap lighting: fresnel rim plus one key light so the knot reads as 3D
      vec3 viewDir = normalize(-vPos);
      vec3 n = normalize(vNormal);
      float fresnel = pow(1.0 - max(dot(viewDir, n), 0.0), 2.0);
      float key = max(dot(n, normalize(vec3(0.6, 0.8, 0.4))), 0.0);

      // Aurora color: phase moves with time and position, so the whole
      // surface drifts through hues as it pulses
      float phase = uTime * 0.15 + vPulse * 0.12 + length(vPos) * 0.15;
      vec3 iridescent = palette(phase);

      // Push the rim and pulse bands above 1.0 so UnrealBloomPass picks them up
      float emissive = fresnel * 1.6 + 0.35 * key + 0.2 * max(vPulse, 0.0);
      vec3 color = iridescent * (0.25 + 0.75 * key) + iridescent * emissive;
      gl_FragColor = vec4(color, 1.0);
    }
  `,
});
const hero = new THREE.Mesh(heroGeometry, heroMaterial);
scene.add(hero);

// --- Particle field ----------------------------------------------------------
// One BufferGeometry + gl.POINTS: drawing 9000 points in a single draw call
// instead of 9000 meshes is the difference between 1 and 9000 draw calls.
const COUNT = 9000;
const position = new Float32Array(COUNT * 3); // initial orbit spot (also defines the bounding sphere)
const aRadius = new Float32Array(COUNT);
const aSpeed = new Float32Array(COUNT);
const aPhase = new Float32Array(COUNT);
const aY = new Float32Array(COUNT);
const aSize = new Float32Array(COUNT);

for (let i = 0; i < COUNT; i++) {
  // Bias toward the inner shell: pow < 1 spreads values toward the max
  const r = 2.2 + Math.pow(Math.random(), 1.7) * 5.5;
  const phase = Math.random() * Math.PI * 2;
  aRadius[i] = r;
  // Mostly one direction, a little variance so the field does not look rigid
  aSpeed[i] = (0.08 + Math.random() * 0.22) * (Math.random() < 0.85 ? 1 : -1);
  aPhase[i] = phase;
  aY[i] = (Math.random() - 0.5) * (0.4 + Math.random() * 2.4);
  aSize[i] = 1.0 + Math.random() * 2.5;
  position[i * 3 + 0] = Math.cos(phase) * r;
  position[i * 3 + 1] = aY[i];
  position[i * 3 + 2] = Math.sin(phase) * r;
}

const particleGeometry = new THREE.BufferGeometry();
particleGeometry.setAttribute('position', new THREE.BufferAttribute(position, 3));
particleGeometry.setAttribute('aRadius', new THREE.BufferAttribute(aRadius, 1));
particleGeometry.setAttribute('aSpeed', new THREE.BufferAttribute(aSpeed, 1));
particleGeometry.setAttribute('aPhase', new THREE.BufferAttribute(aPhase, 1));
particleGeometry.setAttribute('aY', new THREE.BufferAttribute(aY, 1));
particleGeometry.setAttribute('aSize', new THREE.BufferAttribute(aSize, 1));

const particleMaterial = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 },
    uPixelRatio: { value: Math.min(window.devicePixelRatio, 2) },
  },
  vertexShader: /* glsl */`
    uniform float uTime;
    uniform float uPixelRatio;
    attribute float aRadius;
    attribute float aSpeed;
    attribute float aPhase;
    attribute float aY;
    attribute float aSize;
    varying float vAlpha;
    varying vec3 vColor;

    vec3 palette(float t) {
      return vec3(0.5) + vec3(0.5) * cos(6.28318 * (t + vec3(0.0, 0.33, 0.67)));
    }

    void main() {
      // Orbit computed on the GPU: the angle advances with uTime, so no
      // per-frame CPU buffer upload for thousands of points
      float angle = aPhase + uTime * aSpeed;
      vec3 pos = vec3(cos(angle) * aRadius, aY, sin(angle) * aRadius);
      vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);

      // Depth-based fade: -mvPosition.z is the view-space distance to the camera
      float dist = max(-mvPosition.z, 0.001);
      vAlpha = 1.0 - smoothstep(6.0, 18.0, dist);

      // Perspective size attenuation: point size is in pixels, so divide by depth
      gl_PointSize = aSize * uPixelRatio * (18.0 / dist);
      gl_Position = projectionMatrix * mvPosition;
      vColor = palette(aPhase * 0.08 + uTime * 0.05);
    }
  `,
  fragmentShader: /* glsl */`
    varying float vAlpha;
    varying vec3 vColor;

    void main() {
      // gl.POINTS is a square quad; round it and soften the edge
      vec2 c = gl_PointCoord - 0.5;
      float d = length(c);
      if (d > 0.5) discard;
      float glow = smoothstep(0.5, 0.0, d);
      // Additive blending accumulates fast with 9000 points, so keep each
      // particle dim: the field should read as a glow, not a white wall
      gl_FragColor = vec4(vColor * 0.75, vAlpha * glow * 0.45);
    }
  `,
  transparent: true,
  depthWrite: false, // additive points should not occlude each other
  blending: THREE.AdditiveBlending, // overlapping particles brighten, like light
});
const particles = new THREE.Points(particleGeometry, particleMaterial);
scene.add(particles);

// --- Post-processing ---------------------------------------------------------
// Composer chain: render scene -> bloom the bright parts -> output pass
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
// UnrealBloomPass(resolution, strength, radius, threshold):
// threshold 0.75 means only the hero's >1.0 emissive bands and dense particle
// overlaps actually glow, while the dark background stays dark
const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  0.75,  // strength
  0.5,   // radius
  0.85,  // threshold
);
composer.addPass(bloomPass);
// OutputPass applies tone mapping and sRGB conversion (required on r152+ when
// rendering through an EffectComposer)
composer.addPass(new OutputPass());

// --- Camera controls (drag to orbit, scroll to zoom) --------------------------
// The camera never follows the raw pointer position. Drag deltas accumulate
// into target values, and the live values ease toward them each frame.
const state = {
  yaw: 0.6, pitch: 0.35, radius: 7,
  targetYaw: 0.6, targetPitch: 0.35, targetRadius: 7,
  dragging: false,
  lastX: 0, lastY: 0,
};
const MIN_RADIUS = 3.5;
const MAX_RADIUS = 16;
const YAW_SENSITIVITY = 0.005;   // radians per pixel, horizontal
const PITCH_SENSITIVITY = 0.004; // radians per pixel, vertical (a bit gentler)

canvas.addEventListener('pointerdown', (e) => {
  state.dragging = true;
  state.lastX = e.clientX;
  state.lastY = e.clientY;
  canvas.classList.add('dragging');
  try { canvas.setPointerCapture(e.pointerId); } catch { /* synthetic events in tests */ }
});

canvas.addEventListener('pointermove', (e) => {
  if (!state.dragging) return;
  // Accumulate deltas, not absolute position: dragging is relative motion
  state.targetYaw += (e.clientX - state.lastX) * YAW_SENSITIVITY;
  state.targetPitch += (e.clientY - state.lastY) * PITCH_SENSITIVITY;
  // Keep the camera from flipping over the poles
  state.targetPitch = THREE.MathUtils.clamp(state.targetPitch, -1.45, 1.45);
  state.lastX = e.clientX;
  state.lastY = e.clientY;
});

canvas.addEventListener('pointerup', () => {
  state.dragging = false;
  canvas.classList.remove('dragging');
});
canvas.addEventListener('pointercancel', () => {
  state.dragging = false;
  canvas.classList.remove('dragging');
});

// Wheel dollies the camera. Exponential scaling makes zoom feel proportional
// at any radius. passive: false is required to allow preventDefault().
canvas.addEventListener('wheel', (e) => {
  e.preventDefault(); // stop the page itself from scrolling
  state.targetRadius = THREE.MathUtils.clamp(
    state.targetRadius * Math.exp(e.deltaY * 0.001),
    MIN_RADIUS,
    MAX_RADIUS,
  );
}, { passive: false });

// --- Resize ------------------------------------------------------------------
window.addEventListener('resize', () => {
  const w = window.innerWidth;
  const h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix(); // aspect lives in the projection matrix
  renderer.setSize(w, h);
  composer.setSize(w, h); // composer and its passes need the new size too
  particleMaterial.uniforms.uPixelRatio.value = Math.min(window.devicePixelRatio, 2);
});

// --- Loading overlay ---------------------------------------------------------
function hideLoading() {
  loadingEl.classList.add('hidden');
  loadingEl.addEventListener('transitionend', () => loadingEl.remove(), { once: true });
}

// --- Cleanup -----------------------------------------------------------------
// Nothing here is rebuilt at runtime, but dispose everything on page hide so a
// bfcache round trip or SPA navigation does not leak GPU memory
function dispose() {
  cancelAnimationFrame(rafId);
  heroGeometry.dispose();
  heroMaterial.dispose();
  particleGeometry.dispose();
  particleMaterial.dispose();
  if (composer.dispose) composer.dispose();
  renderer.dispose();
}
window.addEventListener('pagehide', dispose);

// Expose a small handle for debugging and automated tests
window.__scene = { camera, state };

// --- Animation loop ----------------------------------------------------------
const MIN_FRAME_MS = 1000 / 60;
let rafId = 0;
let lastFrame = performance.now();
let firstFrame = true;

function tick(now) {
  rafId = requestAnimationFrame(tick);
  const elapsed = now - lastFrame;
  // rAF runs at the display refresh rate; on 120Hz+ panels we skip frames to
  // hold ~60fps and keep the GPU workload bounded
  if (elapsed < MIN_FRAME_MS) return;
  lastFrame = now - (elapsed % MIN_FRAME_MS); // preserve phase so the cap does not drift
  const dt = Math.min(elapsed / 1000, 0.1); // clamp dt so a backgrounded tab does not jump

  // Advance shader time
  heroMaterial.uniforms.uTime.value += dt;
  particleMaterial.uniforms.uTime.value = heroMaterial.uniforms.uTime.value;

  // Frame-rate independent damping: 1 - exp(-lambda*dt) is the exact
  // exponential-decay solution, so 30fps and 144fps converge identically
  const t = 1 - Math.exp(-6 * dt);
  state.yaw += (state.targetYaw - state.yaw) * t;
  state.pitch += (state.targetPitch - state.pitch) * t;
  state.radius += (state.targetRadius - state.radius) * t;

  // Spherical coordinates around the origin
  camera.position.set(
    state.radius * Math.sin(state.pitch) * Math.sin(state.yaw),
    state.radius * Math.cos(state.pitch),
    state.radius * Math.sin(state.pitch) * Math.cos(state.yaw),
  );
  camera.lookAt(0, 0, 0);

  composer.render();

  if (firstFrame) {
    firstFrame = false;
    hideLoading(); // the scene is visible; fade the overlay out
  }
}
rafId = requestAnimationFrame(tick);
</script>
</body>
</html>
