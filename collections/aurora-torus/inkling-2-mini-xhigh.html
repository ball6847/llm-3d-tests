<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Aurora Torus</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #04050a; }
  body {
    font-family: ui-sans-serif, system-ui, sans-serif;
    /* Slight radial glow behind the canvas so the bloom reads against depth,
       not a flat #000 slab. */
    background: radial-gradient(ellipse 120% 90% at 50% 42%, #0d1226 0%, #04050a 68%);
  }
  canvas#scene { position: fixed; inset: 0; display: block; touch-action: none; cursor: grab; }
  canvas#scene.dragging { cursor: grabbing; }

  .loading {
    position: fixed; inset: 0; display: grid; place-items: center;
    background: rgba(4, 5, 10, 0.92); z-index: 10;
    color: #b8c3e0; font-size: 13px; letter-spacing: 0.22em; text-transform: uppercase;
    transition: opacity 0.6s ease; pointer-events: none;
  }
  .loading.done { opacity: 0; }

  .hint {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
    color: #7f8bb3; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase;
    background: rgba(10, 13, 26, 0.55); border: 1px solid rgba(120, 140, 200, 0.18);
    padding: 8px 16px; border-radius: 999px; backdrop-filter: blur(6px);
    z-index: 5; pointer-events: none; white-space: nowrap;
    transition: opacity 1.2s ease;
  }
  .hint.fade { opacity: 0; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<canvas id="scene"></canvas>
<div id="loading" class="loading">Loading…</div>
<div class="hint" id="hint">Drag to orbit&ensp;·&ensp;Scroll to zoom</div>

<script>
  // Plain (non-module) watchdog: the module script below sets window.__ready on the
  // first frame. If it never does, the CDN or WebGL failed and the overlay must say so.
  window.__ready = false;
  window.addEventListener('error', function () {
    if (!window.__ready) {
      var el = document.getElementById('loading');
      if (el) el.textContent = 'Could not start the scene. Check your connection and reload.';
    }
  }, { once: true });
  setTimeout(function () {
    if (!window.__ready) {
      var el = document.getElementById('loading');
      if (el) el.textContent = 'Could not start the scene. Check your connection and reload.';
    }
  }, 10000);
</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const canvas = document.getElementById('scene');

// ---------- Renderer ----------
// antialias + capped pixel ratio: on Retina displays 2x already doubles the frame
// buffer, so anything beyond that mostly wastes GPU time.
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
} catch (err) {
  document.getElementById('loading').textContent = 'WebGL is not available in this browser.';
  throw err;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x04050a, 1);
// ACES keeps bright emissive pixels from clipping to a flat white; OutputPass applies it.
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x04050a, 0.055); // fade distant particles into the bg

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 80);

// ---------- Hero: torus knot with a pulsating iridescent shader ----------
// A torus knot is procedural and organic-looking on its own, so it needs no model file.
const heroUniforms = { uTime: { value: 0 } };
const heroGeo = new THREE.TorusKnotGeometry(1.35, 0.42, 220, 36);
const heroMat = new THREE.ShaderMaterial({
  uniforms: heroUniforms,
  vertexShader: /* glsl */`
    uniform float uTime;
    varying vec3 vNormalW;
    varying vec3 vViewDir;
    varying vec3 vWorldPos;
    varying float vPulse;
    void main() {
      // Breathing displacement along the normal: cheap and gives the knot a pulse.
      float wave = sin(uTime * 2.1 + position.y * 2.4 + position.x * 1.3);
      vPulse = wave;
      vec3 pos = position + normal * wave * 0.055;
      vec4 world = modelMatrix * vec4(pos, 1.0);
      vWorldPos = world.xyz;
      vNormalW = normalize(mat3(modelMatrix) * normal);
      vViewDir = normalize(cameraPosition - world.xyz);
      gl_Position = projectionMatrix * viewMatrix * world;
    }
  `,
  fragmentShader: /* glsl */`
    uniform float uTime;
    varying vec3 vNormalW;
    varying vec3 vViewDir;
    varying vec3 vWorldPos;
    varying float vPulse;
    // Cosine palette (Inigo Quilez): a smooth, cycling rainbow from one parameter.
    vec3 palette(float t) {
      vec3 a = vec3(0.5);
      vec3 b = vec3(0.62);
      vec3 c = vec3(1.0);
      vec3 d = vec3(0.00, 0.33, 0.67);
      return a + b * cos(6.28318 * (c * t + d));
    }
    void main() {
      vec3 n = normalize(vNormalW);
      vec3 v = normalize(vViewDir);
      float ndv = max(dot(n, v), 0.0);
      float fres = pow(1.0 - ndv, 2.5);         // rim brightens near the silhouette
      // Aurora sweep: time drives the palette, fresnel bends it, world height adds depth.
      float t = uTime * 0.16 + vPulse * 0.18 + vWorldPos.y * 0.38;
      vec3 aurora = palette(t * 0.5 + fres * 1.45);
      // Saturate the palette so the aurora bands survive the bloom pass.
      float grey = dot(aurora, vec3(0.3333));
      aurora = mix(vec3(grey), aurora * 1.35, 1.55);
      // Tight specular sheen so the bloom pass has hot spots to grab.
      vec3 hv = normalize(v + normalize(vec3(0.25, 0.8, 0.45)));
      float spec = pow(max(dot(n, hv), 0.0), 28.0);
      vec3 col = aurora * (0.42 + fres * 1.05) + vec3(0.95, 0.98, 1.0) * spec * 0.6;
      col *= 1.15;  // push past the bloom threshold without blowing the whole frame out
      gl_FragColor = vec4(col, 1.0);
    }
  `,
});
const hero = new THREE.Mesh(heroGeo, heroMat);
scene.add(hero);

// ---------- Particle field: one BufferGeometry, one draw call ----------
// Thousands of points orbiting the hero. Positions are computed in the vertex shader
// from tiny per-particle attributes, so the CPU never updates a buffer per frame.
const PARTICLE_COUNT = 6000;
const POSITIONS = new Float32Array(PARTICLE_COUNT * 3);
const PHIS = new Float32Array(PARTICLE_COUNT);
const SPEEDS = new Float32Array(PARTICLE_COUNT);
const SIZES = new Float32Array(PARTICLE_COUNT);
const PHASES = new Float32Array(PARTICLE_COUNT);
const HUES = new Float32Array(PARTICLE_COUNT);

for (let i = 0; i < PARTICLE_COUNT; i++) {
  // Denser toward the core, sparse in the outer ring.
  const r = 2.5 + Math.pow(Math.random(), 1.7) * 4.3;
  const y = (Math.random() * 2 - 1) * 2.25;
  const phi = Math.random() * Math.PI * 2;
  POSITIONS[i * 3 + 0] = Math.cos(phi) * r;
  POSITIONS[i * 3 + 1] = y;
  POSITIONS[i * 3 + 2] = Math.sin(phi) * r;
  PHIS[i] = phi;
  SPEEDS[i] = (0.06 + Math.random() * 0.22) * (Math.random() < 0.18 ? -1 : 1);
  SIZES[i] = 0.7 + Math.random() * 2.9;
  PHASES[i] = Math.random() * Math.PI * 2;
  HUES[i] = Math.random();
}

const particleGeo = new THREE.BufferGeometry();
particleGeo.setAttribute('position', new THREE.BufferAttribute(POSITIONS, 3));
particleGeo.setAttribute('aPhi', new THREE.BufferAttribute(PHIS, 1));
particleGeo.setAttribute('aSpeed', new THREE.BufferAttribute(SPEEDS, 1));
particleGeo.setAttribute('aSize', new THREE.BufferAttribute(SIZES, 1));
particleGeo.setAttribute('aPhase', new THREE.BufferAttribute(PHASES, 1));
particleGeo.setAttribute('aHue', new THREE.BufferAttribute(HUES, 1));
// Geometry is animated on the GPU, so growth beyond the stored positions is expected.
particleGeo.boundingSphere = new THREE.Sphere(new THREE.Vector3(0, 0, 0), 12);

const particleUniforms = {
  uTime: { value: 0 },
  uPixelRatio: { value: renderer.getPixelRatio() },
};
const particleMat = new THREE.ShaderMaterial({
  uniforms: particleUniforms,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending, // glow stacks additively, like real bloom
  vertexShader: /* glsl */`
    uniform float uTime;
    uniform float uPixelRatio;
    attribute float aPhi;
    attribute float aSpeed;
    attribute float aSize;
    attribute float aPhase;
    attribute float aHue;
    varying float vFade;
    varying float vAlpha;
    varying float vTwinkle;
    varying float vHue;
    void main() {
      float ang = aPhi + uTime * aSpeed;
      float r = length(position.xz);
      vec3 pos = vec3(
        cos(ang) * r,
        position.y + sin(uTime * 0.65 + aPhase) * 0.4,
        sin(ang) * r
      );
      vec4 mv = modelViewMatrix * vec4(pos, 1.0);
      float dist = -mv.z;
      // Depth-based fade: particles far from the camera fade out, near ones stay bright.
      vFade = 1.0 - smoothstep(3.5, 13.0, dist);
      vAlpha = 0.13 + 0.3 * clamp(vFade, 0.0, 1.0);
      vTwinkle = 0.55 + 0.45 * sin(uTime * 2.8 + aPhase * 6.0);
      vHue = aHue;
      gl_PointSize = aSize * uPixelRatio * (62.0 / max(dist, 0.1));
      gl_PointSize = min(gl_PointSize, 20.0 * uPixelRatio);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: /* glsl */`
    varying float vFade;
    varying float vAlpha;
    varying float vTwinkle;
    varying float vHue;
    void main() {
      vec2 d = gl_PointCoord - 0.5;
      float r = length(d);
      // Soft round sprite instead of a square point.
      float soft = smoothstep(0.5, 0.06, r);
      float a = vAlpha * soft * vFade * vTwinkle;
      if (a < 0.004) discard;
      vec3 cyan = vec3(0.35, 0.82, 1.0);
      vec3 violet = vec3(0.86, 0.42, 1.0);
      vec3 pink = vec3(1.0, 0.45, 0.7);
      vec3 base = mix(cyan, violet, vHue);
      base = mix(base, pink, smoothstep(0.72, 1.0, vHue));
      gl_FragColor = vec4(base * 1.05, a);
    }
  `,
});
const particles = new THREE.Points(particleGeo, particleMat);
particles.frustumCulled = false;
scene.add(particles);

// ---------- Post-processing: bloom over the dark scene ----------
// UnrealBloomPass smears bright emissive pixels into a visible glow. The threshold is
// kept below the shader peak so the knot reads hot while the dark background stays still.
const composer = new EffectComposer(renderer);
const renderPass = new RenderPass(scene, camera);
const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  0.5,    // strength
  0.45,   // radius
  0.62    // threshold
);
composer.addPass(renderPass);
composer.addPass(bloomPass);
composer.addPass(new OutputPass()); // restores sRGB + tone mapping after bloom

// ---------- Interaction: drag-to-orbit, wheel zoom ----------
const ORBIT = { yaw: 0.6, pitch: 0.32, radius: 8.4 };
const TARGET = { yaw: 0.6, pitch: 0.32, radius: 8.4 };
const SPRING = 6.0;                // damping rate; higher = snappier, lower = looser
const MIN_RADIUS = 4.6;
const MAX_RADIUS = 14.5;
const MAX_PITCH = 1.25;
const DRAG_SENS = 0.0052;          // radians of orbit per pixel dragged
let dragging = false;
let lastX = 0;
let lastY = 0;

canvas.addEventListener('pointerdown', (e) => {
  dragging = true;
  lastX = e.clientX;
  lastY = e.clientY;
  canvas.classList.add('dragging');
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  const dx = e.clientX - lastX;
  const dy = e.clientY - lastY;
  lastX = e.clientX;
  lastY = e.clientY;
  TARGET.yaw += dx * DRAG_SENS;
  TARGET.pitch += dy * DRAG_SENS;
  TARGET.pitch = THREE.MathUtils.clamp(TARGET.pitch, -MAX_PITCH, MAX_PITCH);
});
function endDrag(e) {
  if (!dragging) return;
  dragging = false;
  canvas.classList.remove('dragging');
  if (e && e.pointerId !== undefined && canvas.hasPointerCapture(e.pointerId)) {
    canvas.releasePointerCapture(e.pointerId);
  }
}
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);

// Wheel zoom: clamped and damped; must be non-passive so preventDefault stops the page scroll.
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  TARGET.radius = THREE.MathUtils.clamp(TARGET.radius + e.deltaY * 0.011, MIN_RADIUS, MAX_RADIUS);
}, { passive: false });

// Fade the hint chip away after the user starts interacting.
const hintEl = document.getElementById('hint');
setTimeout(() => hintEl.classList.add('fade'), 9000);
canvas.addEventListener('pointerdown', () => hintEl.classList.add('fade'), { once: true });

// ---------- Responsive ----------
function resize() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(w, h);
  particleUniforms.uPixelRatio.value = renderer.getPixelRatio();
  composer.setPixelRatio(renderer.getPixelRatio());
  composer.setSize(w, h);
}
window.addEventListener('resize', resize);

// ---------- Animation loop ----------
// rAF caps the loop at the display refresh rate; dt is clamped so a tab stall
// does not teleport the camera. damp() is frame-rate independent.
const clock = new THREE.Clock();
let firstFrame = true;
let alive = true;
let lastFrameMs = 0;
const TARGET_FPS = 60;
const MIN_FRAME_MS = 1000 / TARGET_FPS;

function animate() {
  if (!alive) return;
  requestAnimationFrame(animate);
  // rAF runs at the display refresh rate; skip frames that arrive too early so the
  // loop never exceeds ~60fps even on high-refresh displays.
  const now = performance.now();
  if (now - lastFrameMs < MIN_FRAME_MS) return;
  lastFrameMs = now;
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  heroUniforms.uTime.value = t;
  particleUniforms.uTime.value = t;

  hero.rotation.y += dt * 0.22;
  hero.rotation.x += dt * 0.07;

  // Ease toward drag targets instead of snapping.
  ORBIT.yaw = THREE.MathUtils.damp(ORBIT.yaw, TARGET.yaw, SPRING, dt);
  ORBIT.pitch = THREE.MathUtils.damp(ORBIT.pitch, TARGET.pitch, SPRING, dt);
  ORBIT.radius = THREE.MathUtils.damp(ORBIT.radius, TARGET.radius, SPRING, dt);

  const cp = Math.cos(ORBIT.pitch);
  camera.position.set(
    ORBIT.radius * Math.sin(ORBIT.yaw) * cp,
    ORBIT.radius * Math.sin(ORBIT.pitch),
    ORBIT.radius * Math.cos(ORBIT.yaw) * cp
  );
  camera.lookAt(0, 0, 0);

  composer.render();

  if (firstFrame) {
    firstFrame = false;
    window.__ready = true;
    const loading = document.getElementById('loading');
    loading.classList.add('done');
    setTimeout(() => loading.remove(), 700);
  }
}
animate();

// Clean up on page hide so nothing lingers in the GPU heap.
window.addEventListener('pagehide', () => {
  alive = false;
  heroGeo.dispose();
  particleGeo.dispose();
  heroMat.dispose();
  particleMat.dispose();
  renderer.dispose();
});
</script>
</body>
</html>
