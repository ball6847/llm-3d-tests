<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aurora Torus Knot</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #04060c;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    #scene-canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
      touch-action: none; /* Prevent browser touch scrolling so pointer drag drives orbit cleanly */
    }

    #scene-canvas.dragging {
      cursor: grabbing;
    }

    #loading-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #04060c;
      color: #cbd5e1;
      font-size: 15px;
      letter-spacing: 0.06em;
      z-index: 20;
      transition: opacity 450ms ease;
    }

    #loading-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #loading-overlay .error-detail {
      max-width: 420px;
      padding: 0 20px;
      text-align: center;
      font-size: 13px;
      line-height: 1.5;
      color: #94a3b8;
    }

    #controls-hint {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(10, 15, 28, 0.6);
      border: 1px solid rgba(148, 163, 184, 0.18);
      color: rgba(226, 232, 240, 0.72);
      font-size: 12px;
      letter-spacing: 0.03em;
      pointer-events: none;
      backdrop-filter: blur(6px);
      z-index: 10;
    }
  </style>

  <!-- Import map lets native browser ES modules resolve bare "three" specifiers without a bundler -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="loading-overlay" role="status" aria-live="polite">
    <span id="loading-text">Loading…</span>
  </div>
  <canvas id="scene-canvas" aria-label="Interactive 3D aurora torus knot"></canvas>
  <div id="controls-hint">Drag to orbit · Scroll to zoom</div>

  <script>
    // Catch module/CDN import failures before the ES module executes
    window.__sceneLoaded = false;
    window.__showModuleFallback = function (reason) {
      var overlay = document.getElementById('loading-overlay');
      var text = document.getElementById('loading-text');
      if (!overlay || !text) return;
      overlay.classList.remove('hidden');
      text.textContent = 'Unable to initialize 3D scene';
      if (!overlay.querySelector('.error-detail')) {
        var detail = document.createElement('p');
        detail.className = 'error-detail';
        detail.textContent = reason || 'Failed to load Three.js from CDN or initialize WebGL.';
        overlay.appendChild(detail);
      }
    };
  </script>

  <script type="module" onerror="window.__showModuleFallback('Could not load Three.js module from CDN.')">
    import * as THREE from 'three';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

    window.__sceneLoaded = true;
    const canvas = document.getElementById('scene-canvas');
    const loadingOverlay = document.getElementById('loading-overlay');

    function showFallbackError(message) {
      window.__showModuleFallback(message);
    }

    // Check WebGL support up front so browsers without GPU acceleration fail cleanly
    function hasWebGLSupport() {
      try {
        const probe = document.createElement('canvas');
        return Boolean(
          window.WebGLRenderingContext &&
          (probe.getContext('webgl2') || probe.getContext('webgl'))
        );
      } catch {
        return false;
      }
    }

    if (!hasWebGLSupport()) {
      showFallbackError('WebGL is disabled or unsupported in this browser.');
      throw new Error('WebGL unsupported');
    }

    // --- Renderer, scene, and camera setup ---
    const renderer = new THREE.WebGLRenderer({
      canvas,
      antialias: true,
      powerPreference: 'high-performance'
    });
    // Cap pixel ratio at 2 to avoid pushing 4x+ fragment shading on high-DPI screens
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    // ACES filmic tone mapping compresses bright >1.0 emissive colors smoothly into display range
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x04060c);
    scene.fog = new THREE.FogExp2(0x04060c, 0.045);

    const camera = new THREE.PerspectiveCamera(
      52,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );

    // --- Post-processing bloom pipeline ---
    // Render scene into an HDR-capable buffer, extract bright emissive pixels, then tone-map to screen
    const renderTarget = new THREE.WebGLRenderTarget(
      window.innerWidth,
      window.innerHeight,
      { type: THREE.HalfFloatType }
    );
    const composer = new EffectComposer(renderer, renderTarget);
    composer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    composer.setSize(window.innerWidth, window.innerHeight);

    const renderPass = new RenderPass(scene, camera);
    const bloomPass = new UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight),
      0.62, // Bloom strength: highlights emissive aurora ribbons without washing out midtones
      0.48, // Bloom radius: crisp halo around bright edges
      0.68  // Luminance threshold: keeps dark background and core shading free of haze
    );
    const outputPass = new OutputPass();

    composer.addPass(renderPass);
    composer.addPass(bloomPass);
    composer.addPass(outputPass);

    // --- Central hero object with custom GLSL aurora shader ---
    let heroGeometry = null;
    let heroMaterial = null;
    let heroMesh = null;

    const heroUniforms = {
      uTime: { value: 0 }
    };

    const heroVertexShader = /* glsl */ `
      uniform float uTime;

      varying vec3 vWorldNormal;
      varying vec3 vWorldPos;
      varying vec2 vUv;
      varying float vPulse;

      void main() {
        vUv = uv;

        // Harmonic surface ripple keeps the silhouette organic while preserving the knot form
        float waveA = sin(position.x * 2.4 + uTime * 1.4);
        float waveB = cos(position.y * 2.7 - uTime * 1.1);
        float waveC = sin(position.z * 2.2 + uTime * 1.7);
        float displacement = (waveA + waveB + waveC) * 0.032;

        // Travel an energy pulse along the major loop coordinate
        vPulse = 0.5 + 0.5 * sin(uv.x * 18.8495 - uTime * 2.4);

        vec3 displaced = position + normal * displacement;
        vec4 worldPos = modelMatrix * vec4(displaced, 1.0);

        vWorldPos = worldPos.xyz;
        vWorldNormal = normalize(mat3(modelMatrix) * normal);

        gl_Position = projectionMatrix * viewMatrix * worldPos;
      }
    `;

    const heroFragmentShader = /* glsl */ `
      uniform float uTime;

      varying vec3 vWorldNormal;
      varying vec3 vWorldPos;
      varying vec2 vUv;
      varying float vPulse;

      // Cosine gradient generates smooth iridescent hue transitions with zero texture lookups
      vec3 auroraPalette(float t) {
        vec3 a = vec3(0.18, 0.24, 0.36);
        vec3 b = vec3(0.42, 0.45, 0.52);
        vec3 c = vec3(1.0, 1.0, 1.0);
        vec3 d = vec3(0.08, 0.35, 0.68);
        return a + b * cos(6.2831853 * (c * t + d));
      }

      void main() {
        vec3 N = normalize(vWorldNormal);
        vec3 V = normalize(cameraPosition - vWorldPos);

        // Fresnel term boosts brightness on grazing edges for a translucent aurora shell feel
        float ndotv = clamp(dot(N, V), 0.0, 1.0);
        float fresnel = pow(1.0 - ndotv, 2.8);

        // Shift hue by surface normal, position, view angle, and time for live iridescence
        float phase =
          vUv.x * 1.15 +
          dot(N, vec3(0.35, 0.55, 0.4)) * 0.42 +
          fresnel * 0.5 -
          uTime * 0.14;

        vec3 baseAurora = auroraPalette(phase);
        vec3 rimAurora = auroraPalette(phase + 0.32 + sin(uTime * 0.5) * 0.08);

        // Thin emissive ribbons exceed 1.0 luminance so UnrealBloomPass lights up only the veins
        float ribbonWave = sin(vUv.y * 12.5663 + vUv.x * 6.2831 - uTime * 1.9) * 0.5 + 0.5;
        float ribbon = smoothstep(0.76, 0.99, ribbonWave);
        float breathe = 0.8 + 0.2 * sin(uTime * 1.6);

        vec3 coreColor = baseAurora * (0.14 + 0.24 * ndotv);
        vec3 rimGlow = rimAurora * fresnel * 1.25 * breathe;
        vec3 ribbonColor = mix(vec3(0.05, 0.95, 0.78), vec3(0.76, 0.22, 1.0), vPulse);
        vec3 emissiveBand = ribbonColor * ribbon * (0.85 + 0.45 * vPulse);

        vec3 finalColor = coreColor + rimGlow + emissiveBand;
        gl_FragColor = vec4(finalColor, 1.0);
      }
    `;

    // --- Orbiting particle field (BufferGeometry + gl.POINTS) ---
    let particleGeometry = null;
    let particleMaterial = null;
    let particlePoints = null;

    const particleUniforms = {
      uTime: { value: 0 },
      uPixelRatio: { value: Math.min(window.devicePixelRatio || 1, 2) }
    };

    const particleVertexShader = /* glsl */ `
      uniform float uTime;
      uniform float uPixelRatio;

      attribute float aOrbitRadius;
      attribute float aOrbitAngle;
      attribute float aOrbitSpeed;
      attribute float aHeightOffset;
      attribute float aSize;
      attribute float aColorMix;

      varying float vDepthAlpha;
      varying float vColorMix;

      void main() {
        // Advance each point along its orbit in the shader to avoid per-frame CPU buffer uploads
        float angle = aOrbitAngle + uTime * aOrbitSpeed;
        float bob = sin(uTime * 0.9 + aOrbitAngle * 2.0) * 0.18;

        vec3 orbitPos = vec3(
          cos(angle) * aOrbitRadius,
          aHeightOffset + bob,
          sin(angle) * aOrbitRadius
        );

        vec4 mvPosition = modelViewMatrix * vec4(orbitPos, 1.0);
        float dist = length(mvPosition.xyz);

        // Fade both size and opacity as particles move very close or far from the camera
        float nearFade = smoothstep(1.2, 3.0, dist);
        float farFade = 1.0 - smoothstep(6.5, 17.0, dist);
        vDepthAlpha = clamp(nearFade * farFade, 0.0, 1.0);
        vColorMix = aColorMix;

        float perspectiveSize = aSize * (22.0 / max(dist, 0.6));
        gl_PointSize = clamp(perspectiveSize * (0.4 + 0.6 * vDepthAlpha) * uPixelRatio, 1.0, 14.0);
        gl_Position = projectionMatrix * mvPosition;
      }
    `;

    const particleFragmentShader = /* glsl */ `
      varying float vDepthAlpha;
      varying float vColorMix;

      void main() {
        // Turn square GL point sprites into soft radial discs
        vec2 centered = gl_PointCoord - vec2(0.5);
        float r = length(centered);
        if (r > 0.5) discard;

        float softEdge = pow(1.0 - r * 2.0, 2.0);
        vec3 colorA = vec3(0.15, 0.9, 0.84);
        vec3 colorB = vec3(0.58, 0.34, 0.98);
        vec3 color = mix(colorA, colorB, vColorMix);

        float alpha = softEdge * vDepthAlpha * 0.68;
        gl_FragColor = vec4(color * (0.75 + 0.45 * vDepthAlpha), alpha);
      }
    `;

    function buildSceneObjects() {
      // Dispose any prior GPU buffers/shaders before allocating replacements
      disposeSceneObjects();

      heroGeometry = new THREE.TorusKnotGeometry(1.32, 0.4, 260, 48, 2, 3);
      heroMaterial = new THREE.ShaderMaterial({
        uniforms: heroUniforms,
        vertexShader: heroVertexShader,
        fragmentShader: heroFragmentShader
      });
      heroMesh = new THREE.Mesh(heroGeometry, heroMaterial);
      scene.add(heroMesh);

      const particleCount = 4000;
      const positions = new Float32Array(particleCount * 3);
      const orbitRadius = new Float32Array(particleCount);
      const orbitAngle = new Float32Array(particleCount);
      const orbitSpeed = new Float32Array(particleCount);
      const heightOffset = new Float32Array(particleCount);
      const sizes = new Float32Array(particleCount);
      const colorMix = new Float32Array(particleCount);

      for (let i = 0; i < particleCount; i++) {
        // Bias radius outward slightly so particles frame the hero knot without obscuring it
        const r = 2.4 + Math.pow(Math.random(), 0.75) * 6.8;
        const theta = Math.random() * Math.PI * 2;
        const y = (Math.random() - 0.5) * 4.4;

        positions[i * 3] = Math.cos(theta) * r;
        positions[i * 3 + 1] = y;
        positions[i * 3 + 2] = Math.sin(theta) * r;

        orbitRadius[i] = r;
        orbitAngle[i] = theta;
        // Inner particles orbit faster than outer particles for natural orbital parallax
        orbitSpeed[i] = (0.14 + Math.random() * 0.14) * (3.2 / r);
        heightOffset[i] = y;
        sizes[i] = 1.2 + Math.random() * 2.4;
        colorMix[i] = Math.random();
      }

      particleGeometry = new THREE.BufferGeometry();
      particleGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      particleGeometry.setAttribute('aOrbitRadius', new THREE.BufferAttribute(orbitRadius, 1));
      particleGeometry.setAttribute('aOrbitAngle', new THREE.BufferAttribute(orbitAngle, 1));
      particleGeometry.setAttribute('aOrbitSpeed', new THREE.BufferAttribute(orbitSpeed, 1));
      particleGeometry.setAttribute('aHeightOffset', new THREE.BufferAttribute(heightOffset, 1));
      particleGeometry.setAttribute('aSize', new THREE.BufferAttribute(sizes, 1));
      particleGeometry.setAttribute('aColorMix', new THREE.BufferAttribute(colorMix, 1));

      particleMaterial = new THREE.ShaderMaterial({
        uniforms: particleUniforms,
        vertexShader: particleVertexShader,
        fragmentShader: particleFragmentShader,
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending
      });

      particlePoints = new THREE.Points(particleGeometry, particleMaterial);
      scene.add(particlePoints);
    }

    function disposeSceneObjects() {
      if (heroMesh) {
        scene.remove(heroMesh);
        heroMesh = null;
      }
      if (heroGeometry) {
        heroGeometry.dispose();
        heroGeometry = null;
      }
      if (heroMaterial) {
        heroMaterial.dispose();
        heroMaterial = null;
      }
      if (particlePoints) {
        scene.remove(particlePoints);
        particlePoints = null;
      }
      if (particleGeometry) {
        particleGeometry.dispose();
        particleGeometry = null;
      }
      if (particleMaterial) {
        particleMaterial.dispose();
        particleMaterial = null;
      }
    }

    function disposeAll() {
      disposeSceneObjects();
      bloomPass.dispose();
      outputPass.dispose();
      composer.dispose();
      renderTarget.dispose();
      renderer.dispose();
    }

    buildSceneObjects();

    // --- Drag-to-orbit + wheel-zoom camera controller ---
    const YAW_SENSITIVITY = 0.0065;
    const PITCH_SENSITIVITY = 0.0055;
    const ZOOM_SENSITIVITY = 0.0045;
    const MIN_PITCH = -Math.PI * 0.44;
    const MAX_PITCH = Math.PI * 0.44;
    const MIN_RADIUS = 3.2;
    const MAX_RADIUS = 14.0;
    const DAMPING = 9.0; // Higher value tightens tracking while still smoothing sudden input

    let targetYaw = 0.55;
    let targetPitch = 0.25;
    let targetRadius = 6.2;

    let currentYaw = targetYaw;
    let currentPitch = targetPitch;
    let currentRadius = targetRadius;

    let isDragging = false;
    let activePointerId = null;
    let lastPointerX = 0;
    let lastPointerY = 0;

    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, value));
    }

    function updateCameraPosition() {
      const cosPitch = Math.cos(currentPitch);
      camera.position.set(
        currentRadius * cosPitch * Math.sin(currentYaw),
        currentRadius * Math.sin(currentPitch),
        currentRadius * cosPitch * Math.cos(currentYaw)
      );
      camera.lookAt(0, 0, 0);
    }

    updateCameraPosition();

    canvas.addEventListener('pointerdown', (event) => {
      if (event.button !== 0 && event.pointerType === 'mouse') return;
      isDragging = true;
      activePointerId = event.pointerId;
      lastPointerX = event.clientX;
      lastPointerY = event.clientY;
      canvas.classList.add('dragging');
      canvas.setPointerCapture(event.pointerId);
    });

    canvas.addEventListener('pointermove', (event) => {
      if (!isDragging || event.pointerId !== activePointerId) return;
      const dx = event.clientX - lastPointerX;
      const dy = event.clientY - lastPointerY;
      lastPointerX = event.clientX;
      lastPointerY = event.clientY;

      targetYaw -= dx * YAW_SENSITIVITY;
      targetPitch = clamp(targetPitch + dy * PITCH_SENSITIVITY, MIN_PITCH, MAX_PITCH);
    });

    function endDrag(event) {
      if (!isDragging || event.pointerId !== activePointerId) return;
      isDragging = false;
      activePointerId = null;
      canvas.classList.remove('dragging');
      if (canvas.hasPointerCapture(event.pointerId)) {
        canvas.releasePointerCapture(event.pointerId);
      }
    }

    canvas.addEventListener('pointerup', endDrag);
    canvas.addEventListener('pointercancel', endDrag);

    // passive: false is required so preventDefault() stops page scrolling while zooming
    window.addEventListener(
      'wheel',
      (event) => {
        event.preventDefault();
        targetRadius = clamp(
          targetRadius + event.deltaY * ZOOM_SENSITIVITY,
          MIN_RADIUS,
          MAX_RADIUS
        );
      },
      { passive: false }
    );

    // --- Responsive resize handler ---
    function handleResize() {
      const width = window.innerWidth;
      const height = window.innerHeight;
      const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);

      camera.aspect = width / height;
      camera.updateProjectionMatrix();

      renderer.setPixelRatio(pixelRatio);
      renderer.setSize(width, height);

      composer.setPixelRatio(pixelRatio);
      composer.setSize(width, height);
      bloomPass.setSize(width, height);

      particleUniforms.uPixelRatio.value = pixelRatio;
    }

    window.addEventListener('resize', handleResize);
    window.addEventListener('beforeunload', disposeAll);

    // --- Animation loop capped at ~60fps ---
    const TARGET_FPS = 60;
    const FRAME_INTERVAL_MS = 1000 / TARGET_FPS;

    let rafId = 0;
    let lastFrameMs = 0;
    let elapsedTime = 0;
    let firstFrameRendered = false;

    function animate(nowMs) {
      rafId = requestAnimationFrame(animate);

      if (lastFrameMs === 0) {
        lastFrameMs = nowMs;
      }

      const deltaMs = nowMs - lastFrameMs;
      // Skip intermediate ticks on 120Hz/144Hz monitors to stay near 60fps
      if (firstFrameRendered && deltaMs < FRAME_INTERVAL_MS - 0.5) {
        return;
      }

      lastFrameMs = nowMs;
      // Clamp dt so switching browser tabs never causes a large animation jump
      const dt = Math.min(deltaMs / 1000, 0.05);
      elapsedTime += dt;

      heroUniforms.uTime.value = elapsedTime;
      particleUniforms.uTime.value = elapsedTime;

      if (heroMesh) {
        heroMesh.rotation.y = elapsedTime * 0.16;
        heroMesh.rotation.x = Math.sin(elapsedTime * 0.25) * 0.14;
      }

      // Frame-rate independent exponential damping prevents snapping at any refresh rate
      const smoothFactor = 1 - Math.exp(-DAMPING * dt);
      currentYaw += (targetYaw - currentYaw) * smoothFactor;
      currentPitch += (targetPitch - currentPitch) * smoothFactor;
      currentRadius += (targetRadius - currentRadius) * smoothFactor;
      updateCameraPosition();

      composer.render();

      if (!firstFrameRendered) {
        firstFrameRendered = true;
        loadingOverlay.classList.add('hidden');
      }
    }

    rafId = requestAnimationFrame(animate);

    // Clean up pending frame callback if page unloads mid-animation
    window.addEventListener('pagehide', () => {
      cancelAnimationFrame(rafId);
      disposeAll();
    });
  </script>
</body>
</html>
